name: test
on:
  push:
    branches: [test]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      THEOS: ${{ github.workspace }}/.theos
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang lld llvm flex bison m4 gawk autoconf automake libtool-bin libssl-dev libxml2-dev zlib1g-dev liblzma-dev
      - name: test
        run: |
          python3 tools/test_timelm_port.py -v
          python3 tools/check-source.py
      - uses: actions/cache@v4
        with:
          path: .theos
          key: sdk-16.5-toolchain-a72a7a5-${{ runner.os }}
      - name: build
        run: tools/ci-build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-kernel
          path: out/
          retention-days: 7
          if-no-files-found: error
